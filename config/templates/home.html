<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2em;
            color: #2d3748;
            margin-bottom: 12px;
        }

        .header p {
            color: #718096;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .version {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-top: 10px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-path {
            font-size: 1.1em;
            font-weight: 600;
            color: #667eea;
            text-decoration: none;
        }

        .card-path:hover {
            text-decoration: underline;
        }

        .card-description {
            color: #4a5568;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .methods {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .method {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            color: white;
        }

        .method-get { background: #48bb78; }
        .method-post { background: #4299e1; }
        .method-put { background: #ed8936; }
        .method-patch { background: #9f7aea; }
        .method-delete { background: #f56565; }

        .admin-link {
            margin-top: 30px;
            text-align: center;
        }

        .admin-link a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 0.9em;
        }

        .admin-link a:hover {
            text-decoration: underline;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>&#x1f4da; {{ title }}</h1>
            <p>{{ description }}</p>
            <span class="version">v{{ version }}</span>
        </div>

        {% for endpoint in endpoints %}
        <div class="card">
            <div class="card-header">
                <a href="{{ endpoint.path }}" class="card-path">{{ endpoint.path }}</a>
            </div>
            <div class="card-description">{{ endpoint.description }}</div>
            <div class="methods">
                {% for method in endpoint.methods_list %}
                <span class="method method-{{ method|lower }}">{{ method }}</span>
                {% endfor %}
            </div>
        </div>
        {% endfor %}

        <div class="admin-link">
            <a href="/admin/">&#x2699; Перейти в админ-панель</a>
        </div>
    </div>
</body>
</html>
